<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05030a" />
<title>万圣节快乐 · Happy Halloween</title>
<style>
  :root {
    --ink: #05030a;
    --orange: #ff9a1e;
    --amber: #ffd27a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    overflow: hidden;
  }

  body {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: #f6e8d2;
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }

  /* ---------- 夜空 ---------- */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(120% 80% at 78% 8%, rgba(78, 48, 122, 0.34) 0%, rgba(24, 16, 40, 0.2) 34%, transparent 62%),
      radial-gradient(90% 60% at 12% 100%, rgba(255, 96, 0, 0.12) 0%, transparent 60%),
      radial-gradient(130% 100% at 50% 0%, #150f24 0%, #0a0712 45%, #05030a 100%);
  }

  #stars { position: absolute; inset: 0; }
  #stars i {
    position: absolute;
    display: block;
    border-radius: 50%;
    background: #fff;
    opacity: var(--o, .6);
    box-shadow: 0 0 6px rgba(255, 255, 255, .75);
    animation: twinkle var(--d, 4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle {
    0%, 100% { opacity: calc(var(--o, .6) * .25); transform: scale(.75); }
    50%      { opacity: var(--o, .6); transform: scale(1.15); }
  }

  /* 月亮 */
  .moon-wrap {
    position: absolute;
    top: clamp(4vh, 7vh, 90px);
    right: clamp(6vw, 9vw, 150px);
    width: clamp(84px, 11vw, 156px);
    aspect-ratio: 1;
  }
  .moon-halo {
    position: absolute;
    inset: -120%;
    background: radial-gradient(circle, rgba(255, 236, 190, .30) 0%, rgba(255, 210, 140, .12) 32%, transparent 62%);
    filter: blur(6px);
    animation: haloBreathe 9s ease-in-out infinite;
  }
  .moon {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 32%, #fffdf2 0%, #f7eccb 46%, #ddc9a0 78%, #b9a37c 100%);
    box-shadow:
      0 0 32px rgba(255, 238, 196, .55),
      0 0 90px rgba(255, 214, 150, .28),
      0 0 180px rgba(255, 190, 110, .14);
    filter: blur(.3px);
  }
  .moon::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 66% 26%, rgba(120, 102, 74, .22) 0 6%, transparent 7%),
      radial-gradient(circle at 38% 62%, rgba(120, 102, 74, .18) 0 9%, transparent 10%),
      radial-gradient(circle at 74% 68%, rgba(120, 102, 74, .16) 0 5%, transparent 6%),
      radial-gradient(circle at 26% 34%, rgba(120, 102, 74, .13) 0 4%, transparent 5%);
    filter: blur(1.5px);
  }
  @keyframes haloBreathe {
    0%, 100% { opacity: .75; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.05); }
  }

  /* 雾 */
  .fog {
    position: fixed;
    left: -20%;
    width: 140%;
    pointer-events: none;
    mix-blend-mode: screen;
    filter: blur(40px);
    opacity: .5;
  }
  .fog-1 {
    bottom: -18vh;
    height: 52vh;
    background:
      radial-gradient(50% 60% at 30% 80%, rgba(120, 88, 180, .30), transparent 70%),
      radial-gradient(45% 55% at 72% 90%, rgba(255, 110, 30, .16), transparent 72%);
    animation: fogDrift 26s ease-in-out infinite alternate;
  }
  .fog-2 {
    top: 8vh;
    height: 42vh;
    background:
      radial-gradient(40% 50% at 62% 30%, rgba(90, 70, 150, .22), transparent 72%),
      radial-gradient(35% 45% at 18% 60%, rgba(80, 110, 170, .14), transparent 74%);
    animation: fogDrift 38s ease-in-out infinite alternate-reverse;
    opacity: .38;
  }
  @keyframes fogDrift {
    from { transform: translate3d(-3%, 1%, 0) scale(1); }
    to   { transform: translate3d(3%, -2%, 0) scale(1.08); }
  }

  /* ---------- 南瓜 ---------- */
  .pumpkins { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .pumpkin {
    position: absolute;
    animation: pumpkinDrift var(--dur, 12s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    will-change: transform;
  }
  .pumpkin svg {
    display: block;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 12px rgba(255, 118, 20, .42)) drop-shadow(0 0 34px rgba(255, 80, 0, .16));
  }
  .pumpkin .face {
    filter: drop-shadow(0 0 5px rgba(255, 168, 60, .95));
    animation: faceGlow 3.6s ease-in-out infinite;
    animation-delay: var(--fd, 0s);
  }
  @keyframes faceGlow {
    0%, 100% { opacity: .78; }
    42%      { opacity: 1; }
    46%      { opacity: .62; }
    52%      { opacity: .95; }
  }
  @keyframes pumpkinDrift {
    0% {
      transform: translate(-50%, -50%) translate3d(0, 0, 0) rotate(calc(var(--rot, 4deg) * -1));
    }
    33% {
      transform: translate(-50%, -50%) translate3d(calc(var(--amp, 20px) * .7 * var(--flip, 1)), calc(var(--amp, 20px) * -1), 0) rotate(var(--rot, 4deg));
    }
    66% {
      transform: translate(-50%, -50%) translate3d(calc(var(--amp, 20px) * -.45 * var(--flip, 1)), calc(var(--amp, 20px) * -.35), 0) rotate(calc(var(--rot, 4deg) * .45));
    }
    100% {
      transform: translate(-50%, -50%) translate3d(0, 0, 0) rotate(calc(var(--rot, 4deg) * -1));
    }
  }

  /* ---------- 特效画布 ---------- */
  #fx {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
  }

  /* ---------- 暗角 ---------- */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background:
      radial-gradient(110% 90% at 50% 46%, transparent 40%, rgba(2, 1, 6, .55) 78%, rgba(2, 1, 6, .92) 100%),
      linear-gradient(180deg, rgba(3, 2, 8, .55) 0%, transparent 22%, transparent 76%, rgba(3, 2, 8, .7) 100%);
  }

  /* ---------- 标题 ---------- */
  .stage {
    position: relative;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 8vh 5vw;
    text-align: center;
    pointer-events: none;
  }

  .title {
    position: relative;
    margin: 0;
    font-weight: 900;
    font-size: clamp(2.7rem, 12.5vw, 9.6rem);
    line-height: 1.12;
    letter-spacing: .055em;
    text-align: center;
    transform: translateZ(0);
  }
  .title .glow,
  .title .txt { display: block; white-space: nowrap; }

  .title .glow {
    position: absolute;
    inset: 0;
    color: #ff7a15;
    filter: blur(17px);
    opacity: .62;
    user-select: none;
    animation: haloPulse 4.8s ease-in-out infinite;
    will-change: opacity, filter;
  }
  .title .txt {
    position: relative;
    background: linear-gradient(180deg, #fff9dd 0%, #ffe29a 26%, #ffb52e 58%, #ff7a0d 82%, #ff4e00 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 158, 40, .62)) drop-shadow(0 0 44px rgba(255, 92, 0, .42));
    animation: flicker 5.6s linear infinite;
  }
  @keyframes haloPulse {
    0%, 100% { opacity: .45; filter: blur(15px); }
    38%      { opacity: .9;  filter: blur(28px); }
    62%      { opacity: .6;  filter: blur(19px); }
  }
  @keyframes flicker {
    0%, 17%, 23%, 26%, 49%, 54%, 58%, 100% { opacity: 1; }
    19% { opacity: .58; }
    24% { opacity: .82; }
    51% { opacity: .66; }
    56% { opacity: .9; }
  }

  .sub {
    margin: clamp(10px, 2.2vh, 22px) 0 0;
    font-size: clamp(.6rem, 1.5vw, .92rem);
    letter-spacing: .62em;
    text-indent: .62em;
    color: rgba(255, 202, 138, .62);
    text-transform: uppercase;
    animation: subGlow 6s ease-in-out infinite;
  }
  @keyframes subGlow {
    0%, 100% { opacity: .55; text-shadow: 0 0 12px rgba(255, 140, 30, .35); }
    50%      { opacity: .95; text-shadow: 0 0 24px rgba(255, 160, 40, .65); }
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: clamp(16px, 4vh, 40px);
    z-index: 6;
    transform: translateX(-50%);
    margin: 0;
    font-size: clamp(.62rem, 1.3vw, .78rem);
    letter-spacing: .28em;
    text-indent: .28em;
    color: rgba(224, 204, 240, .34);
    white-space: nowrap;
    pointer-events: none;
    animation: hintFade 7s ease-in-out infinite;
  }
  @keyframes hintFade {
    0%, 100% { opacity: .3; }
    50%      { opacity: .72; }
  }

  /* ---------- 谢德（Shade） ---------- */
  #ghost {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 8;
    width: clamp(78px, 8.6vw, 122px);
    pointer-events: none;
    will-change: transform;
    transform: translate3d(50vw, 60vh, 0) translate(-50%, -50%);
    opacity: 0;
    animation: ghostIn 2.4s ease-out .35s forwards;
  }
  @keyframes ghostIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  #ghost svg {
    display: block;
    width: 100%;
    height: auto;
    filter:
      drop-shadow(0 0 12px rgba(176, 110, 255, .5))
      drop-shadow(0 0 40px rgba(120, 70, 220, .26));
    animation: ghostBob 4.2s ease-in-out infinite;
  }
  @keyframes ghostBob {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-6px) scale(1.022); }
  }
  .ghost-eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 6s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 45%, 50%, 100% { transform: scaleY(1); }
    47.5%              { transform: scaleY(.08); }
  }
  .wisp {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 7;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(196, 150, 255, .85) 0%, rgba(150, 100, 230, .28) 45%, rgba(120, 80, 200, 0) 72%);
    filter: blur(2px);
    will-change: transform;
    transform: translate3d(50vw, 60vh, 0) translate(-50%, -50%);
  }

  /* ---------- 万圣节宝箱 ---------- */
  #chest {
    position: fixed;
    left: clamp(14px, 4.5vw, 66px);
    bottom: clamp(54px, 9vh, 98px);
    z-index: 7;
    width: clamp(94px, 11vw, 142px);
    cursor: pointer;
    pointer-events: auto;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .2s ease;
  }
  #chest:hover  { transform: translateY(-3px); }
  #chest:active { transform: translateY(0) scale(.95); }
  #chest:focus-visible {
    outline: 2px solid rgba(200, 160, 255, .85);
    outline-offset: 10px;
    border-radius: 16px;
  }
  #chest svg {
    display: block;
    width: 100%;
    height: auto;
    filter:
      drop-shadow(0 0 10px rgba(176, 110, 255, .5))
      drop-shadow(0 0 28px rgba(120, 70, 220, .22));
    animation: chestBob 3.4s ease-in-out infinite;
    transition: filter .5s ease;
  }
  @keyframes chestBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  /* 已解锁：金橙色 + 紫色更强的光 */
  #chest.is-open svg {
    filter:
      drop-shadow(0 0 14px rgba(255, 172, 64, .6))
      drop-shadow(0 0 42px rgba(160, 100, 255, .42));
  }
  .chest-lid {
    transform-box: view-box;
    transform-origin: 22px 78px;
    transition: transform .55s cubic-bezier(.34, 1.4, .5, 1);
  }
  #chest.is-open .chest-lid { transform: rotate(-38deg); }

  .chest-treasure {
    opacity: 0;
    transform-box: view-box;
    transform-origin: 80px 78px;
    transform: translateY(8px) scale(.62);
    transition: opacity .45s ease, transform .55s cubic-bezier(.34, 1.4, .5, 1);
  }
  #chest.is-open .chest-treasure {
    opacity: 1;
    transform: translateY(0) scale(1);
    transition-delay: .12s;
  }

  .chest-tip {
    position: absolute;
    left: 50%;
    top: 100%;
    margin: 2px 0 0;
    white-space: nowrap;
    font-size: clamp(.56rem, 1.15vw, .72rem);
    letter-spacing: .16em;
    text-indent: .16em;
    color: rgba(206, 178, 255, .5);
    pointer-events: none;
    animation: hintFade 4.4s ease-in-out infinite;
  }
  #chest.is-open .chest-tip { color: rgba(255, 202, 138, .68); }

  /* ---------- 糖果特效层 ---------- */
  #candy-layer {
    position: fixed;
    inset: 0;
    z-index: 9;
    pointer-events: none;
    overflow: hidden;
  }
  .candy {
    position: fixed;
    left: 0;
    top: 0;
    width: var(--size, 24px);
    height: var(--size, 24px);
    opacity: 0;
    will-change: transform, opacity;
    animation: candyFly var(--dur, 2.8s) linear var(--delay, 0s) forwards;
    filter:
      drop-shadow(0 0 6px rgba(255, 150, 40, .45))
      drop-shadow(0 0 12px rgba(160, 100, 255, .3));
  }
  .candy svg { display: block; width: 100%; height: 100%; }
  @keyframes candyFly {
    0% {
      opacity: 0;
      animation-timing-function: cubic-bezier(.14, .82, .36, 1);
      transform: translate3d(var(--x, 0px), var(--y, 0px), 0) translate(-50%, -50%) rotate(0deg) scale(.35);
    }
    14% {
      opacity: 1;
      animation-timing-function: cubic-bezier(.4, .02, .82, .42);
      transform: translate3d(calc(var(--x, 0px) + var(--bx, 0px) * .32), calc(var(--y, 0px) + var(--peak, -120px)), 0)
                 translate(-50%, -50%) rotate(calc(var(--rot, 360deg) * .22)) scale(1.12);
    }
    80% {
      opacity: 1;
      animation-timing-function: cubic-bezier(.4, .02, .82, .42);
    }
    100% {
      opacity: 0;
      transform: translate3d(calc(var(--x, 0px) + var(--bx, 0px)), calc(var(--y, 0px) + var(--fall, 620px)), 0)
                 translate(-50%, -50%) rotate(var(--rot, 360deg)) scale(.92);
    }
  }

  /* ---------- 密码弹窗 ---------- */
  .pw-mask {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(6, 2, 14, .62);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s ease;
  }
  .pw-mask.show { opacity: 1; pointer-events: auto; }

  .pw-card {
    position: relative;
    width: min(92vw, 380px);
    padding: 28px 26px 24px;
    border-radius: 20px;
    text-align: center;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(122, 74, 200, .38), transparent 62%),
      linear-gradient(180deg, #1e1032 0%, #160b27 55%, #100818 100%);
    border: 1px solid rgba(176, 130, 255, .3);
    box-shadow:
      0 24px 60px rgba(0, 0, 0, .6),
      0 0 44px rgba(140, 90, 230, .28),
      inset 0 1px 0 rgba(255, 255, 255, .07);
    transform: translateY(16px) scale(.94);
    transition: transform .32s cubic-bezier(.2, .9, .3, 1.25);
  }
  .pw-mask.show .pw-card { transform: translateY(0) scale(1); }
  .pw-card.err { animation: pwShake .44s cubic-bezier(.36, .07, .19, .97); }
  @keyframes pwShake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-7px); }
    40%, 60% { transform: translateX(7px); }
  }

  .pw-close {
    position: absolute;
    top: 10px;
    right: 12px;
    width: 30px;
    height: 30px;
    padding: 0;
    font-size: 20px;
    line-height: 1;
    color: rgba(214, 190, 255, .6);
    background: transparent;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: color .25s, background .25s;
  }
  .pw-close:hover { color: #ffeacc; background: rgba(255, 255, 255, .08); }

  .pw-icon {
    width: 54px;
    height: 54px;
    margin: 0 auto 10px;
    animation: pwPulse 2.8s ease-in-out infinite;
  }
  .pw-icon svg { display: block; width: 100%; height: 100%; }
  @keyframes pwPulse {
    0%, 100% { opacity: .8; transform: scale(1); }
    50%      { opacity: 1;  transform: scale(1.06); }
  }

  .pw-title {
    margin: 0;
    font-size: clamp(1.02rem, 3.4vw, 1.3rem);
    font-weight: 800;
    letter-spacing: .06em;
    background: linear-gradient(180deg, #fff6dd 0%, #ffd68a 45%, #ffa726 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 150, 40, .35));
  }
  .pw-sub {
    margin: 8px 0 0;
    font-size: .72rem;
    letter-spacing: .2em;
    text-indent: .2em;
    color: rgba(206, 182, 246, .5);
  }
  .pw-input {
    width: 100%;
    margin-top: 18px;
    padding: 13px 14px;
    font-family: inherit;
    font-size: 1.45rem;
    text-align: center;
    letter-spacing: .5em;
    text-indent: .5em;
    color: #f6e8d2;
    background: rgba(255, 255, 255, .05);
    border: 1.5px solid rgba(176, 130, 255, .38);
    border-radius: 12px;
    outline: none;
    transition: border-color .25s, box-shadow .25s, background .25s;
  }
  .pw-input::placeholder { color: rgba(230, 210, 255, .26); }
  .pw-input:focus {
    background: rgba(255, 255, 255, .08);
    border-color: rgba(200, 160, 255, .75);
    box-shadow: 0 0 0 4px rgba(140, 90, 230, .18), 0 0 18px rgba(150, 100, 255, .3);
  }
  .pw-msg {
    min-height: 20px;
    margin: 12px 0 0;
    font-size: .8rem;
    letter-spacing: .1em;
    color: rgba(255, 138, 158, .92);
    text-shadow: 0 0 12px rgba(255, 80, 110, .3);
  }
  .pw-msg.ok { color: rgba(150, 240, 190, .95); text-shadow: 0 0 12px rgba(80, 240, 160, .3); }

  .pw-actions { display: flex; gap: 10px; margin-top: 16px; }
  .pw-btn {
    flex: 1;
    padding: 12px 0;
    font-family: inherit;
    font-size: .92rem;
    font-weight: 700;
    letter-spacing: .14em;
    text-indent: .14em;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .18s, filter .25s, background .25s;
  }
  .pw-btn:active { transform: translateY(1px) scale(.985); }
  .pw-btn.main {
    color: #2a1005;
    background: linear-gradient(180deg, #ffd27a 0%, #ff9a1e 55%, #ff6a00 100%);
    box-shadow: 0 0 18px rgba(255, 140, 30, .35);
  }
  .pw-btn.main:hover { filter: brightness(1.08); }
  .pw-btn.ghost {
    color: rgba(226, 208, 250, .82);
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(176, 130, 255, .32);
  }
  .pw-btn.ghost:hover { background: rgba(255, 255, 255, .1); }
  .pw-btn:focus-visible { outline: 2px solid rgba(200, 160, 255, .85); outline-offset: 3px; }

  /* ---------- 吐司提示 ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: clamp(70px, 13vh, 130px);
    z-index: 22;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: clamp(.66rem, 1.4vw, .8rem);
    letter-spacing: .14em;
    text-indent: .14em;
    white-space: nowrap;
    color: #ffeacc;
    background: linear-gradient(180deg, rgba(72, 38, 116, .94), rgba(38, 18, 64, .94));
    border: 1px solid rgba(190, 150, 255, .35);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 26px rgba(150, 100, 255, .3);
    transform: translate(-50%, 12px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    .title { font-size: clamp(2.4rem, 16vw, 4.6rem); letter-spacing: .04em; }
    .fog { filter: blur(28px); }
    .moon-wrap { top: 5vh; right: 8vw; }
    #chest {
      width: clamp(78px, 24vw, 108px);
      left: clamp(10px, 5vw, 30px);
      bottom: clamp(50px, 10vh, 80px);
    }
    .pw-card { padding: 24px 20px 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fog, .moon-halo, .sub, .hint, .ghost-eye { animation: none !important; }
    #chest svg, .chest-tip, .pw-icon { animation: none !important; }
    .pw-mask, .pw-card, #chest { transition-duration: .01ms; }
  }
</style>
</head>
<body>
  <div class="sky">
    <div id="stars"></div>
    <div class="moon-wrap">
      <div class="moon-halo"></div>

<script>
(function () {
  'use strict';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  var W = window.innerWidth;
  var H = window.innerHeight;

  /* ================= 星空 ================= */
  (function buildStars() {
    var box = document.getElementById('stars');
    var count = reduceMotion ? 45 : Math.round(clamp(W / 12, 60, 130));
    var html = '';
    for (var i = 0; i < count; i++) {
      var s = rand(0.8, 2.1).toFixed(1);
      html += '<i style="left:' + rand(0, 100).toFixed(2) + '%;top:' + rand(0, 100).toFixed(2) +
        '%;width:' + s + 'px;height:' + s + 'px;--o:' + rand(0.22, 0.9).toFixed(2) +
        ';--d:' + rand(2.6, 7).toFixed(2) + 's;--delay:-' + rand(0, 7).toFixed(2) + 's"></i>';
    }
    box.innerHTML = html;
  })();

  /* ================= 漂浮南瓜 ================= */
  (function buildPumpkins() {
    var box = document.getElementById('pumpkins');
    var count = W < 640 ? 7 : (reduceMotion ? 6 : 11);
    var svg = [
      '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">',
      '<path d="M47 30q-4-11 2-17 7 7 3 17z" fill="#5d6b2c"/>',
      '<path d="M52 14q13-3 12 9" fill="none" stroke="#6f7d34" stroke-width="1.8" stroke-linecap="round" opacity=".8"/>',
      '<ellipse cx="33" cy="58" rx="21" ry="27" fill="#bf430d"/>',
      '<ellipse cx="67" cy="58" rx="21" ry="27" fill="#bf430d"/>',
      '<ellipse cx="50" cy="58" rx="26" ry="29" fill="#e65b10"/>',
      '<ellipse cx="50" cy="58" rx="15" ry="28.5" fill="#f27118"/>',
      '<g class="face" fill="#ffd486">',
      '<path d="M37 50l10 0-5 9z"/>',
      '<path d="M63 50l-10 0 5 9z"/>',
      '<path d="M35 68h30l-4 10-5-5-5 5-5-5-5 5z"/>',
      '</g>',
      '</svg>'
    ].join('');

    for (var i = 0; i < count; i++) {
      var x, y, tries = 0;
      do {
        x = rand(4, 93);
        y = rand(8, 90);
        tries++;
      } while (x > 24 && x < 76 && y > 26 && y < 76 && tries < 30);

      var size = rand(36, 92);
      var el = document.createElement('div');
      el.className = 'pumpkin';
      el.style.cssText =
        'left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%;' +
        'width:' + size.toFixed(0) + 'px;height:' + size.toFixed(0) + 'px;' +
        '--dur:' + rand(9, 18).toFixed(1) + 's;' +
        '--delay:-' + rand(0, 16).toFixed(1) + 's;' +
        '--amp:' + rand(12, 32).toFixed(0) + 'px;' +
        '--rot:' + rand(3, 8).toFixed(1) + 'deg;' +
        '--flip:' + (Math.random() < 0.5 ? 1 : -1) + ';' +
        '--fd:-' + rand(0, 4).toFixed(1) + 's;' +
        'opacity:' + rand(0.5, 0.95).toFixed(2);
      el.innerHTML = svg;
      box.appendChild(el);
    }
  })();

  /* ================= 谢德（Shade） ================= */
  var ghostEl = document.getElementById('ghost');
  var ghost = { x: W / 2, y: H * 0.6 };
  var pointer = { x: W / 2, y: H * 0.6, last: -99 };
  var trail = [];
  var wisps = [];
  var trailOffsets = [9, 20, 34, 48];

  trailOffsets.forEach(function (off, i) {
    var w = document.createElement('div');
    w.className = 'wisp';
    var size = 20 - i * 3.5;
    w.style.width = size + 'px';
    w.style.height = size + 'px';
    w.style.opacity = (0.34 - i * 0.07).toFixed(2);
    document.body.appendChild(w);
    wisps.push(w);
  });

  window.addEventListener('pointermove', function (e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.last = performance.now() / 1000;
  }, { passive: true });

  function updateGhost(dt, t) {
    var tx, ty;
    var idle = t - pointer.last > 4;
    if (idle) {
      tx = W / 2 + Math.sin(t * 0.42) * (W * 0.15);
      ty = H * 0.58 + Math.cos(t * 0.55) * (H * 0.06);
    } else {
      tx = pointer.x;
      ty = pointer.y;
    }

    var prevX = ghost.x;
    var k = Math.min(1, dt * 2.8);
    ghost.x += (tx - ghost.x) * k;
    ghost.y += (ty - ghost.y) * k;

    var vx = (ghost.x - prevX) / Math.max(dt, 0.001);
    var tilt = clamp(vx * 0.016, -11, 11);
    var rx = ghost.x + Math.cos(t * 1.1) * 4;
    var ry = ghost.y + Math.sin(t * 1.7) * 7;

    ghostEl.style.transform =
      'translate3d(' + rx.toFixed(2) + 'px,' + ry.toFixed(2) + 'px,0) translate(-50%,-50%) rotate(' + tilt.toFixed(2) + 'deg)';

    trail.unshift({ x: rx, y: ry });
    if (trail.length > 60) trail.length = 60;

    for (var i = 0; i < wisps.length; i++) {
      var p = trail[Math.min(trail.length - 1, trailOffsets[i])];
      if (!p) continue;
      wisps[i].style.transform =
        'translate3d(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px,0) translate(-50%,-50%)';
    }
  }

  /* ================= 画布：暗色粒子 + 蝙蝠 ================= */
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = 1;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* --- 粒子精灵 --- */
  function makeSprite(rgb) {
    var size = 64;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d');
    var grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grd.addColorStop(0, 'rgba(' + rgb + ',0.95)');
    grd.addColorStop(0.32, 'rgba(' + rgb + ',0.42)');
    grd.addColorStop(0.7, 'rgba(' + rgb + ',0.10)');
    grd.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
    return c;
  }

  var sprites = [
    makeSprite('150,108,255'),
    makeSprite('255,146,52'),
    makeSprite('112,140,196')
  ];

  var particles = [];
  var particleCount = reduceMotion ? 26 : Math.round(clamp(W / 15, 42, 92));

  function seedParticle(p, initial) {
    p.x = rand(-20, W + 20);
    p.y = initial ? rand(-20, H + 20) : rand(H + 10, H + 120);
    p.r = rand(0.9, 2.6);
    p.vy = rand(9, 34);
    p.vx = rand(-9, 9);
    p.phase = rand(0, Math.PI * 2);
    p.speed = rand(0.5, 1.9);
    p.alpha = rand(0.10, 0.34);
    var roll = Math.random();
    p.sprite = roll < 0.62 ? 0 : (roll < 0.86 ? 2 : 1);
  }

  for (var i = 0; i < particleCount; i++) {
    var p = {};
    seedParticle(p, true);
    particles.push(p);
  }

  function drawParticles(dt, t) {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      q.y -= q.vy * dt;
      q.x += (q.vx + Math.sin(t * q.speed + q.phase) * 14) * dt;
      if (q.y < -60) seedParticle(q, false);
      if (q.x < -60) q.x = W + 50;
      if (q.x > W + 60) q.x = -50;

      var a = q.alpha * (0.55 + 0.45 * Math.sin(t * 1.25 * q.speed + q.phase));
      if (a <= 0.01) continue;
      var d = q.r * 11;
      ctx.globalAlpha = a;
      ctx.drawImage(sprites[q.sprite], q.x - d / 2, q.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* --- 蝙蝠 --- */
  var bats = [];
  var batCount = reduceMotion ? 6 : Math.round(clamp(W / 105, 8, 17));

  function seedBat(b, initial) {
    b.size = rand(24, 72);
    b.x = rand(-40, W + 40);
    b.y = initial ? rand(-H * 0.35, H * 0.6) : rand(-180, -50);
    b.vx = rand(-22, 22);
    b.vy = rand(26, 62) * (0.55 + b.size / 72);
    b.phase = rand(0, Math.PI * 2);
    b.flap = rand(7, 13);
    b.alpha = 0.35 + (b.size / 72) * 0.55;
  }

  for (var j = 0; j < batCount; j++) {
    var b = {};
    seedBat(b, true);
    bats.push(b);
  }

  function drawBat(b, flap) {
    var s = b.size / 64;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.vx * 0.0035);
    ctx.scale(s, s);
    ctx.globalAlpha = b.alpha;

    var f = flap;
    ctx.fillStyle = '#2f2240';
    ctx.strokeStyle = 'rgba(180,145,255,0.22)';
    ctx.lineWidth = 1.1;

    for (var side = -1; side <= 1; side += 2) {
      ctx.save();
      ctx.scale(side, 1);
      ctx.beginPath();
      ctx.moveTo(3, -4);
      ctx.bezierCurveTo(10, -6 - 10 * f, 20, -9 - 16 * f, 32, -2 - 20 * f);
      ctx.bezierCurveTo(26, 2 - 2 * f, 20, 3, 15, 4);
      ctx.quadraticCurveTo(12, 8.5, 9, 5);
      ctx.quadraticCurveTo(6, 9.5, 3, 5);
      ctx.closePath();
      ctx.fill();
      if (b.size > 38) ctx.stroke();
      ctx.restore();
    }

    ctx.beginPath();
    ctx.ellipse(0, 0, 4.6, 7.6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, -8.6, 4.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-3.5, -10.6);
    ctx.lineTo(-5, -16.3);
    ctx.lineTo(-0.9, -12.3);
    ctx.closePath();
    ctx.moveTo(3.5, -10.6);
    ctx.lineTo(5, -16.3);
    ctx.lineTo(0.9, -12.3);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255,196,116,0.92)';
    ctx.beginPath();
    ctx.arc(-1.7, -9.1, 0.85, 0, Math.PI * 2);
    ctx.arc(1.7, -9.1, 0.85, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBats(dt, t) {
    for (var i = 0; i < bats.length; i++) {
      var b = bats[i];
      b.y += b.vy * dt;
      b.x += (b.vx + Math.sin(t * 0.8 + b.phase) * 26) * dt;
      if (b.y > H + 110 || b.x < -160 || b.x > W + 160) seedBat(b, false);
      drawBat(b, Math.sin(t * b.flap + b.phase));
    }
  }

  /* ================= 主循环 ================= */
  var last = performance.now();

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = now / 1000;

    ctx.clearRect(0, 0, W, H);
    drawParticles(dt, t);
    drawBats(dt, t);
    updateGhost(dt, t);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(function (now) {
    last = now;
    frame(now);
  });
})();
</script>

<script>
/* ================= 宝箱 · 密码解锁 · 糖果特效 ================= */
(function () {
  'use strict';

  var PASSWORD = '1031';
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rand = function (a, b) { return a + Math.random() * (b - a); };

  var chest    = document.getElementById('chest');
  var chestTip = document.getElementById('chestTip');
  var layer    = document.getElementById('candy-layer');
  var mask     = document.getElementById('pwMask');
  var card     = document.getElementById('pwCard');
  var input    = document.getElementById('pwInput');
  var msg      = document.getElementById('pwMsg');
  var toastEl  = document.getElementById('toast');

  var unlocked = false;
  var lastFocus = null;
  var toastTimer = null;

  /* ---------------- 吐司提示 ---------------- */
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 2800);
  }

  /* ---------------- 密码弹窗 ---------------- */
  function openModal() {
    if (unlocked || mask.classList.contains('show')) return;
    lastFocus = document.activeElement;
    input.value = '';
    msg.textContent = '';
    msg.className = 'pw-msg';
    card.classList.remove('err');
    mask.classList.add('show');
    mask.setAttribute('aria-hidden', 'false');
    setTimeout(function () {
      try { input.focus(); } catch (e) {}
    }, 120);
  }

  function closeModal() {
    mask.classList.remove('show');
    mask.setAttribute('aria-hidden', 'true');
    try { input.blur(); } catch (e) {}
    if (lastFocus && lastFocus.focus) {
      try { lastFocus.focus(); } catch (e) {}
    }
  }

  function wrongPassword() {
    msg.textContent = '密码不对';
    msg.className = 'pw-msg';
    card.classList.remove('err');
    void card.offsetWidth;          /* 强制回流，重播抖动动画 */
    card.classList.add('err');
    try { input.select(); } catch (e) {}
  }

  function unlockSuccess() {
    unlocked = true;
    chest.classList.add('is-open');
    chest.setAttribute('aria-label', '宝箱已解锁，点击获得糖果');
    chestTip.textContent = '再点一次 · 抢糖果';
    msg.className = 'pw-msg ok';
    input.value = '';
    closeModal();
    toast('解锁成功 · 再点一次试试');
  }

  function submitPassword() {
    if (input.value === PASSWORD) unlockSuccess();
    else wrongPassword();
  }

  document.getElementById('pwOk').addEventListener('click', submitPassword);
  document.getElementById('pwCancel').addEventListener('click', closeModal);
  document.getElementById('pwClose').addEventListener('click', closeModal);
  mask.addEventListener('click', function (e) {
    if (e.target === mask) closeModal();
  });

  input.addEventListener('input', function () {
    input.value = input.value.replace(/\D/g, '').slice(0, 4);
    if (msg.textContent) msg.textContent = '';
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submitPassword(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && mask.classList.contains('show')) closeModal();
  });

  /* ---------------- 糖果特效 ---------------- */
  var CANDY_COLORS = ['#ff8a1e', '#ffb64d', '#c07bff', '#8b5cf6', '#ff5e6e', '#5ad6a0'];
  var CANDY_TYPES = [
    /* 包装糖 */
    '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M1 12 L7.6 7.4 L7.6 16.6 Z" fill="COLOR2"/>' +
      '<path d="M23 12 L16.4 7.4 L16.4 16.6 Z" fill="COLOR2"/>' +
      '<circle cx="12" cy="12" r="7.6" fill="COLOR"/>' +
      '<ellipse cx="9.6" cy="9.2" rx="2.3" ry="1.5" fill="rgba(255,255,255,.5)" transform="rotate(-30 9.6 9.2)"/>' +
      '<path d="M6 15.5 Q10 14.5 12.5 16" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.4" stroke-linecap="round"/>' +
    '</svg>',
    /* 棒棒糖 */
    '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="10.8" y="12" width="2.4" height="11.6" rx="1.2" fill="#efe6ff" opacity=".8"/>' +
      '<circle cx="12" cy="9.6" r="7.8" fill="COLOR"/>' +
      '<path d="M12 3.6 A6 6 0 1 1 5.6 12.6 A3.8 3.8 0 1 1 12 7.4 A1.8 1.8 0 0 1 12 11" fill="none" ' +
        'stroke="rgba(255,255,255,.65)" stroke-width="1.5" stroke-linecap="round"/>' +
    '</svg>',
    /* 软糖 */
    '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M12 2.5 C16.6 9 19 12 19 15 A7 7 0 0 1 5 15 C5 12 7.4 9 12 2.5 Z" fill="COLOR"/>' +
      '<ellipse cx="9.4" cy="12.5" rx="1.6" ry="2.6" fill="rgba(255,255,255,.45)" transform="rotate(-20 9.4 12.5)"/>' +
      '<path d="M6.6 16.6 Q12 19.6 17.4 16.6" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.3"/>' +
    '</svg>',
    /* 星星糖 */
    '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M12 1.6 L14.9 8.5 L22.2 9 L16.7 13.6 L18.5 20.6 L12 16.7 L5.5 20.6 L7.3 13.6 L1.8 9 L9.1 8.5 Z" fill="COLOR"/>' +
      '<circle cx="12" cy="11.6" r="2.4" fill="rgba(255,255,255,.45)"/>' +
    '</svg>'
  ];

  function candySvg(color, color2) {
    return CANDY_TYPES[Math.floor(Math.random() * CANDY_TYPES.length)]
      .replace(/COLOR2/g, color2)
      .replace(/COLOR/g, color);
  }

  function spawnCandy(ox, oy, H) {
    var el = document.createElement('div');
    el.className = 'candy';

    var y = oy + rand(-10, 10);
    var color = CANDY_COLORS[Math.floor(Math.random() * CANDY_COLORS.length)];
    var color2 = CANDY_COLORS[Math.floor(Math.random() * CANDY_COLORS.length)];
    var dur = rand(2.1, 3.5);
    var delay = rand(0, 0.5);

    el.style.setProperty('--size', rand(16, 34).toFixed(1) + 'px');
    el.style.setProperty('--x', (ox + rand(-14, 14)).toFixed(1) + 'px');
    el.style.setProperty('--y', y.toFixed(1) + 'px');
    el.style.setProperty('--bx', (rand(-1, 1) * rand(50, 240)).toFixed(1) + 'px');
    el.style.setProperty('--peak', (-rand(70, 190)).toFixed(1) + 'px');
    el.style.setProperty('--fall', Math.max(340, H + 150 - y).toFixed(1) + 'px');
    el.style.setProperty('--rot', rand(-540, 540).toFixed(0) + 'deg');
    el.style.setProperty('--dur', dur.toFixed(2) + 's');
    el.style.setProperty('--delay', delay.toFixed(2) + 's');

    el.innerHTML = candySvg(color, color2);

    el.addEventListener('animationend', function remove() {
      if (el.parentNode) el.parentNode.removeChild(el);
    });
    /* 兜底清理，避免个别浏览器不触发 animationend */
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, (dur + delay + 0.6) * 1000);

    layer.appendChild(el);
  }

  function burstCandy() {
    if (layer.childElementCount > 220) return;   /* 防止堆积过多 */
    var r = chest.getBoundingClientRect();
    var ox = r.left + r.width / 2;
    var oy = r.top + r.height * 0.35;
    var H = window.innerHeight;
    var n = reduceMotion ? 14 : 28;
    for (var i = 0; i < n; i++) spawnCandy(ox, oy, H);
  }

  /* ---------------- 宝箱交互 ---------------- */
  function activateChest() {
    if (!unlocked) openModal();
    else burstCandy();
  }

  chest.addEventListener('click', activateChest);
  chest.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      activateChest();
    }
  });
})();
</script>
</body>
</html>
