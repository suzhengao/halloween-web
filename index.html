<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05030a" />
<title>万圣节快乐 · Happy Halloween</title>
<style>
  :root {
    --ink: #05030a;
    --orange: #ff9a1e;
    --amber: #ffd27a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    overflow: hidden;
  }

  body {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: #f6e8d2;
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }

  /* ---------- 夜空 ---------- */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(120% 80% at 78% 8%, rgba(78, 48, 122, 0.34) 0%, rgba(24, 16, 40, 0.2) 34%, transparent 62%),
      radial-gradient(90% 60% at 12% 100%, rgba(255, 96, 0, 0.12) 0%, transparent 60%),
      radial-gradient(130% 100% at 50% 0%, #150f24 0%, #0a0712 45%, #05030a 100%);
  }

  #stars { position: absolute; inset: 0; }
  #stars i {
    position: absolute;
    display: block;
    border-radius: 50%;
    background: #fff;
    opacity: var(--o, .6);
    box-shadow: 0 0 6px rgba(255, 255, 255, .75);
    animation: twinkle var(--d, 4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle {
    0%, 100% { opacity: calc(var(--o, .6) * .25); transform: scale(.75); }
    50%      { opacity: var(--o, .6); transform: scale(1.15); }
  }

  /* 月亮 */
  .moon-wrap {
    position: absolute;
    top: clamp(4vh, 7vh, 90px);
    right: clamp(6vw, 9vw, 150px);
    width: clamp(84px, 11vw, 156px);
    aspect-ratio: 1;
  }
  .moon-halo {
    position: absolute;
    inset: -120%;
    background: radial-gradient(circle, rgba(255, 236, 190, .30) 0%, rgba(255, 210, 140, .12) 32%, transparent 62%);
    filter: blur(6px);
    animation: haloBreathe 9s ease-in-out infinite;
  }
  .moon {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 32%, #fffdf2 0%, #f7eccb 46%, #ddc9a0 78%, #b9a37c 100%);
    box-shadow:
      0 0 32px rgba(255, 238, 196, .55),
      0 0 90px rgba(255, 214, 150, .28),
      0 0 180px rgba(255, 190, 110, .14);
    filter: blur(.3px);
  }
  .moon::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 66% 26%, rgba(120, 102, 74, .22) 0 6%, transparent 7%),
      radial-gradient(circle at 38% 62%, rgba(120, 102, 74, .18) 0 9%, transparent 10%),
      radial-gradient(circle at 74% 68%, rgba(120, 102, 74, .16) 0 5%, transparent 6%),
      radial-gradient(circle at 26% 34%, rgba(120, 102, 74, .13) 0 4%, transparent 5%);
    filter: blur(1.5px);
  }
  @keyframes haloBreathe {
    0%, 100% { opacity: .75; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.05); }
  }

  /* 雾 */
  .fog {
    position: fixed;
    left: -20%;
    width: 140%;
    pointer-events: none;
    mix-blend-mode: screen;
    filter: blur(40px);
    opacity: .5;
  }
  .fog-1 {
    bottom: -18vh;
    height: 52vh;
    background:
      radial-gradient(50% 60% at 30% 80%, rgba(120, 88, 180, .30), transparent 70%),
      radial-gradient(45% 55% at 72% 90%, rgba(255, 110, 30, .16), transparent 72%);
    animation: fogDrift 26s ease-in-out infinite alternate;
  }
  .fog-2 {
    top: 8vh;
    height: 42vh;
    background:
      radial-gradient(40% 50% at 62% 30%, rgba(90, 70, 150, .22), transparent 72%),
      radial-gradient(35% 45% at 18% 60%, rgba(80, 110, 170, .14), transparent 74%);
    animation: fogDrift 38s ease-in-out infinite alternate-reverse;
    opacity: .38;
  }
  @keyframes fogDrift {
    from { transform: translate3d(-3%, 1%, 0) scale(1); }
    to   { transform: translate3d(3%, -2%, 0) scale(1.08); }
  }

  /* ---------- 南瓜 ---------- */
  .pumpkins { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .pumpkin {
    position: absolute;
    animation: pumpkinDrift var(--dur, 12s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    will-change: transform;
  }
  .pumpkin svg {
    display: block;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 12px rgba(255, 118, 20, .42)) drop-shadow(0 0 34px rgba(255, 80, 0, .16));
  }
  .pumpkin .face {
    filter: drop-shadow(0 0 5px rgba(255, 168, 60, .95));
    animation: faceGlow 3.6s ease-in-out infinite;
    animation-delay: var(--fd, 0s);
  }
  @keyframes faceGlow {
    0%, 100% { opacity: .78; }
    42%      { opacity: 1; }
    46%      { opacity: .62; }
    52%      { opacity: .95; }
  }
  @keyframes pumpkinDrift {
    0% {
      transform: translate(-50%, -50%) translate3d(0, 0, 0) rotate(calc(var(--rot, 4deg) * -1));
    }
    33% {
      transform: translate(-50%, -50%) translate3d(calc(var(--amp, 20px) * .7 * var(--flip, 1)), calc(var(--amp, 20px) * -1), 0) rotate(var(--rot, 4deg));
    }
    66% {
      transform: translate(-50%, -50%) translate3d(calc(var(--amp, 20px) * -.45 * var(--flip, 1)), calc(var(--amp, 20px) * -.35), 0) rotate(calc(var(--rot, 4deg) * .45));
    }
    100% {
      transform: translate(-50%, -50%) translate3d(0, 0, 0) rotate(calc(var(--rot, 4deg) * -1));
    }
  }

  /* ---------- 特效画布 ---------- */
  #fx {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
  }

  /* ---------- 暗角 ---------- */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background:
      radial-gradient(110% 90% at 50% 46%, transparent 40%, rgba(2, 1, 6, .55) 78%, rgba(2, 1, 6, .92) 100%),
      linear-gradient(180deg, rgba(3, 2, 8, .55) 0%, transparent 22%, transparent 76%, rgba(3, 2, 8, .7) 100%);
  }

  /* ---------- 标题 ---------- */
  .stage {
    position: relative;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 8vh 5vw;
    text-align: center;
    pointer-events: none;
  }

  .title {
    position: relative;
    margin: 0;
    font-weight: 900;
    font-size: clamp(2.7rem, 12.5vw, 9.6rem);
    line-height: 1.12;
    letter-spacing: .055em;
    text-align: center;
    transform: translateZ(0);
  }
  .title .glow,
  .title .txt { display: block; white-space: nowrap; }

  .title .glow {
    position: absolute;
    inset: 0;
    color: #ff7a15;
    filter: blur(17px);
    opacity: .62;
    user-select: none;
    animation: haloPulse 4.8s ease-in-out infinite;
    will-change: opacity, filter;
  }
  .title .txt {
    position: relative;
    background: linear-gradient(180deg, #fff9dd 0%, #ffe29a 26%, #ffb52e 58%, #ff7a0d 82%, #ff4e00 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 158, 40, .62)) drop-shadow(0 0 44px rgba(255, 92, 0, .42));
    animation: flicker 5.6s linear infinite;
  }
  @keyframes haloPulse {
    0%, 100% { opacity: .45; filter: blur(15px); }
    38%      { opacity: .9;  filter: blur(28px); }
    62%      { opacity: .6;  filter: blur(19px); }
  }
  @keyframes flicker {
    0%, 17%, 23%, 26%, 49%, 54%, 58%, 100% { opacity: 1; }
    19% { opacity: .58; }
    24% { opacity: .82; }
    51% { opacity: .66; }
    56% { opacity: .9; }
  }

  .sub {
    margin: clamp(10px, 2.2vh, 22px) 0 0;
    font-size: clamp(.6rem, 1.5vw, .92rem);
    letter-spacing: .62em;
    text-indent: .62em;
    color: rgba(255, 202, 138, .62);
    text-transform: uppercase;
    animation: subGlow 6s ease-in-out infinite;
  }
  @keyframes subGlow {
    0%, 100% { opacity: .55; text-shadow: 0 0 12px rgba(255, 140, 30, .35); }
    50%      { opacity: .95; text-shadow: 0 0 24px rgba(255, 160, 40, .65); }
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: clamp(16px, 4vh, 40px);
    z-index: 6;
    transform: translateX(-50%);
    margin: 0;
    font-size: clamp(.62rem, 1.3vw, .78rem);
    letter-spacing: .28em;
    text-indent: .28em;
    color: rgba(224, 204, 240, .34);
    white-space: nowrap;
    pointer-events: none;
    animation: hintFade 7s ease-in-out infinite;
  }
  @keyframes hintFade {
    0%, 100% { opacity: .3; }
    50%      { opacity: .72; }
  }

  /* ---------- 幽灵 ---------- */
  #ghost {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 8;
    width: clamp(78px, 8.6vw, 122px);
    pointer-events: none;
    will-change: transform;
    transform: translate3d(50vw, 60vh, 0) translate(-50%, -50%);
    opacity: 0;
    animation: ghostIn 2.4s ease-out .35s forwards;
  }
  @keyframes ghostIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  #ghost svg {
    display: block;
    width: 100%;
    height: auto;
    filter:
      drop-shadow(0 0 14px rgba(158, 220, 255, .55))
      drop-shadow(0 0 46px rgba(92, 158, 255, .26));
    animation: ghostBob 4.2s ease-in-out infinite;
  }
  @keyframes ghostBob {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-6px) scale(1.022); }
  }
  .ghost-eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 6s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 45%, 50%, 100% { transform: scaleY(1); }
    47.5%              { transform: scaleY(.08); }
  }
  .wisp {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 7;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(176, 226, 255, .85) 0%, rgba(112, 172, 255, .28) 45%, rgba(90, 140, 255, 0) 72%);
    filter: blur(2px);
    will-change: transform;
    transform: translate3d(50vw, 60vh, 0) translate(-50%, -50%);
  }

  @media (max-width: 560px) {
    .title { font-size: clamp(2.4rem, 16vw, 4.6rem); letter-spacing: .04em; }
    .fog { filter: blur(28px); }
    .moon-wrap { top: 5vh; right: 8vw; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fog, .moon-halo, .sub, .hint, .ghost-eye { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="sky">
    <div id="stars"></div>
    <div class="moon-wrap">
      <div class="moon-halo"></div>
      <div class="moon"></div>
    </div>
  </div>

  <div class="fog fog-1"></div>
  <div class="fog fog-2"></div>

  <div class="pumpkins" id="pumpkins"></div>

  <canvas id="fx"></canvas>

  <div class="vignette"></div>

  <main class="stage">
    <h1 class="title">
      <span class="glow" aria-hidden="true">万圣节快乐</span>
      <span class="txt">万圣节快乐</span>
    </h1>
    <p class="sub">Happy Halloween</p>
  </main>

  <p class="hint">移动鼠标 · 幽灵会跟着你</p>

  <div id="ghost" aria-hidden="true">
    <svg viewBox="0 0 112 150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ghostBody" x1="56" y1="10" x2="56" y2="140" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#f4fbff" stop-opacity=".96" />
          <stop offset=".52" stop-color="#d6ecff" stop-opacity=".8" />
          <stop offset="1" stop-color="#8fc0ff" stop-opacity=".34" />
        </linearGradient>
      </defs>
      <path d="M56 12C30 12 16 34 16 64V122q8 8 16 0 8 8 16 0 8 8 16 0 8 8 16 0 8 8 16 0V64C96 34 82 12 56 12Z"
            fill="url(#ghostBody)" />
      <ellipse class="ghost-eye" cx="42" cy="63" rx="4.6" ry="6.6" fill="#1c2b4a" opacity=".85" />
      <ellipse class="ghost-eye" cx="70" cy="63" rx="4.6" ry="6.6" fill="#1c2b4a" opacity=".85" />
      <path d="M48 82q8 7 16 0" fill="none" stroke="#1c2b4a" stroke-opacity=".55"
            stroke-width="2.6" stroke-linecap="round" />
      <ellipse cx="32" cy="74" rx="5" ry="3" fill="#9fd0ff" opacity=".28" />
      <ellipse cx="80" cy="74" rx="5" ry="3" fill="#9fd0ff" opacity=".28" />
    </svg>
  </div>

<script>
(function () {
  'use strict';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  var W = window.innerWidth;
  var H = window.innerHeight;

  /* ================= 星空 ================= */
  (function buildStars() {
    var box = document.getElementById('stars');
    var count = reduceMotion ? 45 : Math.round(clamp(W / 12, 60, 130));
    var html = '';
    for (var i = 0; i < count; i++) {
      var s = rand(0.8, 2.1).toFixed(1);
      html += '<i style="left:' + rand(0, 100).toFixed(2) + '%;top:' + rand(0, 100).toFixed(2) +
        '%;width:' + s + 'px;height:' + s + 'px;--o:' + rand(0.22, 0.9).toFixed(2) +
        ';--d:' + rand(2.6, 7).toFixed(2) + 's;--delay:-' + rand(0, 7).toFixed(2) + 's"></i>';
    }
    box.innerHTML = html;
  })();

  /* ================= 漂浮南瓜 ================= */
  (function buildPumpkins() {
    var box = document.getElementById('pumpkins');
    var count = W < 640 ? 7 : (reduceMotion ? 6 : 11);
    var svg = [
      '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">',
      '<path d="M47 30q-4-11 2-17 7 7 3 17z" fill="#5d6b2c"/>',
      '<path d="M52 14q13-3 12 9" fill="none" stroke="#6f7d34" stroke-width="1.8" stroke-linecap="round" opacity=".8"/>',
      '<ellipse cx="33" cy="58" rx="21" ry="27" fill="#bf430d"/>',
      '<ellipse cx="67" cy="58" rx="21" ry="27" fill="#bf430d"/>',
      '<ellipse cx="50" cy="58" rx="26" ry="29" fill="#e65b10"/>',
      '<ellipse cx="50" cy="58" rx="15" ry="28.5" fill="#f27118"/>',
      '<g class="face" fill="#ffd486">',
      '<path d="M37 50l10 0-5 9z"/>',
      '<path d="M63 50l-10 0 5 9z"/>',
      '<path d="M35 68h30l-4 10-5-5-5 5-5-5-5 5z"/>',
      '</g>',
      '</svg>'
    ].join('');

    for (var i = 0; i < count; i++) {
      var x, y, tries = 0;
      do {
        x = rand(4, 93);
        y = rand(8, 90);
        tries++;
      } while (x > 24 && x < 76 && y > 26 && y < 76 && tries < 30);

      var size = rand(36, 92);
      var el = document.createElement('div');
      el.className = 'pumpkin';
      el.style.cssText =
        'left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%;' +
        'width:' + size.toFixed(0) + 'px;height:' + size.toFixed(0) + 'px;' +
        '--dur:' + rand(9, 18).toFixed(1) + 's;' +
        '--delay:-' + rand(0, 16).toFixed(1) + 's;' +
        '--amp:' + rand(12, 32).toFixed(0) + 'px;' +
        '--rot:' + rand(3, 8).toFixed(1) + 'deg;' +
        '--flip:' + (Math.random() < 0.5 ? 1 : -1) + ';' +
        '--fd:-' + rand(0, 4).toFixed(1) + 's;' +
        'opacity:' + rand(0.5, 0.95).toFixed(2);
      el.innerHTML = svg;
      box.appendChild(el);
    }
  })();

  /* ================= 幽灵 ================= */
  var ghostEl = document.getElementById('ghost');
  var ghost = { x: W / 2, y: H * 0.6 };
  var pointer = { x: W / 2, y: H * 0.6, last: -99 };
  var trail = [];
  var wisps = [];
  var trailOffsets = [9, 20, 34, 48];

  trailOffsets.forEach(function (off, i) {
    var w = document.createElement('div');
    w.className = 'wisp';
    var size = 20 - i * 3.5;
    w.style.width = size + 'px';
    w.style.height = size + 'px';
    w.style.opacity = (0.34 - i * 0.07).toFixed(2);
    document.body.appendChild(w);
    wisps.push(w);
  });

  window.addEventListener('pointermove', function (e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.last = performance.now() / 1000;
  }, { passive: true });

  function updateGhost(dt, t) {
    var tx, ty;
    var idle = t - pointer.last > 4;
    if (idle) {
      tx = W / 2 + Math.sin(t * 0.42) * (W * 0.15);
      ty = H * 0.58 + Math.cos(t * 0.55) * (H * 0.06);
    } else {
      tx = pointer.x;
      ty = pointer.y;
    }

    var prevX = ghost.x;
    var k = Math.min(1, dt * 2.8);
    ghost.x += (tx - ghost.x) * k;
    ghost.y += (ty - ghost.y) * k;

    var vx = (ghost.x - prevX) / Math.max(dt, 0.001);
    var tilt = clamp(vx * 0.016, -11, 11);
    var rx = ghost.x + Math.cos(t * 1.1) * 4;
    var ry = ghost.y + Math.sin(t * 1.7) * 7;

    ghostEl.style.transform =
      'translate3d(' + rx.toFixed(2) + 'px,' + ry.toFixed(2) + 'px,0) translate(-50%,-50%) rotate(' + tilt.toFixed(2) + 'deg)';

    trail.unshift({ x: rx, y: ry });
    if (trail.length > 60) trail.length = 60;

    for (var i = 0; i < wisps.length; i++) {
      var p = trail[Math.min(trail.length - 1, trailOffsets[i])];
      if (!p) continue;
      wisps[i].style.transform =
        'translate3d(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px,0) translate(-50%,-50%)';
    }
  }

  /* ================= 画布：暗色粒子 + 蝙蝠 ================= */
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = 1;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* --- 粒子精灵 --- */
  function makeSprite(rgb) {
    var size = 64;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d');
    var grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grd.addColorStop(0, 'rgba(' + rgb + ',0.95)');
    grd.addColorStop(0.32, 'rgba(' + rgb + ',0.42)');
    grd.addColorStop(0.7, 'rgba(' + rgb + ',0.10)');
    grd.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
    return c;
  }

  var sprites = [
    makeSprite('150,108,255'),
    makeSprite('255,146,52'),
    makeSprite('112,140,196')
  ];

  var particles = [];
  var particleCount = reduceMotion ? 26 : Math.round(clamp(W / 15, 42, 92));

  function seedParticle(p, initial) {
    p.x = rand(-20, W + 20);
    p.y = initial ? rand(-20, H + 20) : rand(H + 10, H + 120);
    p.r = rand(0.9, 2.6);
    p.vy = rand(9, 34);
    p.vx = rand(-9, 9);
    p.phase = rand(0, Math.PI * 2);
    p.speed = rand(0.5, 1.9);
    p.alpha = rand(0.10, 0.34);
    var roll = Math.random();
    p.sprite = roll < 0.62 ? 0 : (roll < 0.86 ? 2 : 1);
  }

  for (var i = 0; i < particleCount; i++) {
    var p = {};
    seedParticle(p, true);
    particles.push(p);
  }

  function drawParticles(dt, t) {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      q.y -= q.vy * dt;
      q.x += (q.vx + Math.sin(t * q.speed + q.phase) * 14) * dt;
      if (q.y < -60) seedParticle(q, false);
      if (q.x < -60) q.x = W + 50;
      if (q.x > W + 60) q.x = -50;

      var a = q.alpha * (0.55 + 0.45 * Math.sin(t * 1.25 * q.speed + q.phase));
      if (a <= 0.01) continue;
      var d = q.r * 11;
      ctx.globalAlpha = a;
      ctx.drawImage(sprites[q.sprite], q.x - d / 2, q.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* --- 蝙蝠 --- */
  var bats = [];
  var batCount = reduceMotion ? 6 : Math.round(clamp(W / 105, 8, 17));

  function seedBat(b, initial) {
    b.size = rand(24, 72);
    b.x = rand(-40, W + 40);
    b.y = initial ? rand(-H * 0.35, H * 0.6) : rand(-180, -50);
    b.vx = rand(-22, 22);
    b.vy = rand(26, 62) * (0.55 + b.size / 72);
    b.phase = rand(0, Math.PI * 2);
    b.flap = rand(7, 13);
    b.alpha = 0.35 + (b.size / 72) * 0.55;
  }

  for (var j = 0; j < batCount; j++) {
    var b = {};
    seedBat(b, true);
    bats.push(b);
  }

  function drawBat(b, flap) {
    var s = b.size / 64;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.vx * 0.0035);
    ctx.scale(s, s);
    ctx.globalAlpha = b.alpha;

    var f = flap;
    ctx.fillStyle = '#2f2240';
    ctx.strokeStyle = 'rgba(180,145,255,0.22)';
    ctx.lineWidth = 1.1;

    for (var side = -1; side <= 1; side += 2) {
      ctx.save();
      ctx.scale(side, 1);
      ctx.beginPath();
      ctx.moveTo(3, -4);
      ctx.bezierCurveTo(10, -6 - 10 * f, 20, -9 - 16 * f, 32, -2 - 20 * f);
      ctx.bezierCurveTo(26, 2 - 2 * f, 20, 3, 15, 4);
      ctx.quadraticCurveTo(12, 8.5, 9, 5);
      ctx.quadraticCurveTo(6, 9.5, 3, 5);
      ctx.closePath();
      ctx.fill();
      if (b.size > 38) ctx.stroke();
      ctx.restore();
    }

    ctx.beginPath();
    ctx.ellipse(0, 0, 4.6, 7.6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, -8.6, 4.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-3.5, -10.6);
    ctx.lineTo(-5, -16.3);
    ctx.lineTo(-0.9, -12.3);
    ctx.closePath();
    ctx.moveTo(3.5, -10.6);
    ctx.lineTo(5, -16.3);
    ctx.lineTo(0.9, -12.3);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255,196,116,0.92)';
    ctx.beginPath();
    ctx.arc(-1.7, -9.1, 0.85, 0, Math.PI * 2);
    ctx.arc(1.7, -9.1, 0.85, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBats(dt, t) {
    for (var i = 0; i < bats.length; i++) {
      var b = bats[i];
      b.y += b.vy * dt;
      b.x += (b.vx + Math.sin(t * 0.8 + b.phase) * 26) * dt;
      if (b.y > H + 110 || b.x < -160 || b.x > W + 160) seedBat(b, false);
      drawBat(b, Math.sin(t * b.flap + b.phase));
    }
  }

  /* ================= 主循环 ================= */
  var last = performance.now();

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = now / 1000;

    ctx.clearRect(0, 0, W, H);
    drawParticles(dt, t);
    drawBats(dt, t);
    updateGhost(dt, t);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(function (now) {
    last = now;
    frame(now);
  });
})();
</script>
</body>
</html>
